<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Athina's app icon: the Gaze on glaukos.

       Full bleed, because macOS 26 masks a legacy .icns to the app icon shape
       itself and adds the shadow: this square is scaled into the 824 of 1024
       body and its corners rounded off, so nothing here draws a rounded
       rectangle or a shadow, and the Gaze keeps clear of the corners.

       Two groups, so either can be drawn alone: the field, and the Gaze (the
       menu bar mark's own geometry, AthinaGaze.svg's 64-unit grid, filled in as
       a pale facial disc with gold irises and near-black pupils looking down
       at the work). The colours are the design's tokens: the field glaukos 600
       to 800, the disc glaukos 50, the irises lamp 400, the pupils glaukos 950. -->
  <defs>
    <linearGradient id="fieldShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11746B"/>
      <stop offset="1" stop-color="#084741"/>
    </linearGradient>
    <radialGradient id="fieldLight" cx="0.5" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="field">
    <rect width="1024" height="1024" fill="url(#fieldShade)"/>
    <rect width="1024" height="1024" fill="url(#fieldLight)"/>
  </g>
  <!-- 74% of the width across, centred 10 units below the middle. -->
  <g id="gaze" transform="translate(133.1 309.9) scale(13.9046) translate(-4.75 -16.75)">
    <path d="M32 27 A13 13 0 1 0 32 37 A13 13 0 1 0 32 27 Z" fill="#EEFAF8" stroke="#EEFAF8" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="20" cy="32" r="8.4" fill="#F1C45E"/>
    <circle cx="44" cy="32" r="8.4" fill="#F1C45E"/>
    <circle cx="21" cy="35" r="4.6" fill="#041A18"/>
    <circle cx="43" cy="35" r="4.6" fill="#041A18"/>
    <circle cx="22.7" cy="32.5" r="1.15" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="44.7" cy="32.5" r="1.15" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
