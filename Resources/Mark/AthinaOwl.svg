<!--
  Athina's menu bar mark: the owl, the captain's own artwork, drawn as one
  solid silhouette so it sits among the menu bar's other extras rather than
  reading lighter than them.

  This is the master for the menu bar only. The app icon, About and Finder use
  AthinaMark.svg, the Athena drawing, unchanged.

  The drawing is one path: the body, one cutout through it holding both eyes
  and the beak notch, and a pupil filled back into each eye. The states the
  menu bar shows are made from those parts, so the silhouette never changes
  and the item keeps one width in every mode.

  The file the captain supplied carried a C2PA content-credentials manifest.
  It has been stripped here: it is provenance for the artwork, not drawing,
  and the original is kept outside this repository.
-->
