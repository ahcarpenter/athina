name: Merge checks

# The slow check, kept out of ci.yml so it does not hold up every pull request.
# It runs on every push to main and, for a pull request, only while the
# pull request carries the merge-checks label: adding the label runs it, and so
# does every push, or any other label added, while it is on. The main ruleset requires it at the
# pull request's head (.github/rulesets/main.json, README "Continuous
# integration").
#
# A job that an `if` skips still reports a check run, and a skipped check
# counts as passed for a required one, so a skipped run takes another name and
# the required ui-snapshots check stays expected until the job really runs.
# A dispatched run would not do either: its check runs are on the commit, but
# a pull request's required checks ignore them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  ui-snapshots:
    name: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge-checks')) && 'ui-snapshots' || 'ui-snapshots (add the merge-checks label to run)' }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge-checks')
    # The approved renders in Tests/Snapshots were made on this image with its
    # newest Xcode, so a change to either is a deliberate baseline refresh
    # (README "UI snapshot baselines").
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          sw_vers
          swift --version
      - name: Build app bundle
        run: scripts/bundle.sh release
      - name: Render twice and compare with the approved baselines
        # Renders every snapshot twice and fails unless the two are the same
        # picture, then fails on any drift from Tests/Snapshots beyond the
        # tolerance for anti-aliasing and glass (README "UI snapshot baselines").
        timeout-minutes: 20
        run: scripts/snapshots.sh gate
      - name: Summarize
        if: always()
        run: |
          for summary in build/snapshots/determinism/summary.md build/snapshots/report/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload the renders
        # What `scripts/snapshots.sh approve` fetches to approve a drift.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: build/snapshots/render
          if-no-files-found: ignore
      - name: Upload the drift report
        # Before, after and difference images of each drifted snapshot, with
        # index.html showing them side by side at real size.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-report
          path: |
            build/snapshots/report
            build/snapshots/determinism
          if-no-files-found: ignore
