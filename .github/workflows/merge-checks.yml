name: Merge checks

# The slow UI snapshot gate, kept out of ci.yml so it does not hold up every
# push to a pull request, and split across four runners. It runs on every push
# to main and on a pull request that is ready for review: marking a draft ready
# runs it, and so does every push while it is ready, while a draft gets only
# ci.yml's fast lane. It also runs, in full, on every group the merge queue
# builds, where there is no draft and no pull request to comment on. The main
# ruleset requires ui-snapshots at the pull request's head and on the queue's
# group (.github/rulesets/main.json, docs/ci.md).
#
# A job that an `if` skips still reports a check run, and a skipped check
# counts as passed for a required one, so a skipped ui-snapshots takes another
# name and the required check stays expected until the job really runs. A
# dispatched run would not do either: its check runs are on the commit, but a
# pull request's required checks ignore them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# A new push to a pull request, or marking it ready, cancels that pull
# request's run still going; every push to main and every merge queue group
# keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-snapshots-shard:
    # One of four runners, each rendering and comparing the quarter of the
    # snapshots SnapshotShard (Sources/SnapshotDiff) gives it. The approved
    # renders in Tests/Snapshots were made on this image with the Xcode that
    # .xcode-version pins, so a change to either is a deliberate baseline
    # refresh (docs/ci.md "UI snapshot baselines"). This condition, the one on
    # ui-snapshots and the one in its name are the same and change together;
    # only a draft pull request skips, so a push to main and a merge queue
    # group always run the full gate.
    name: ui-snapshots shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      # Every shard runs to the end, so one drift never hides another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/swiftpm-cache
        with:
          # Every shard builds the same, so they share one cache.
          name: ui-snapshots
      - name: Build app bundle
        run: scripts/bundle.sh release
      - name: Render twice and compare with the approved baselines
        # Renders this shard's snapshots twice and fails unless the two are
        # the same picture, then fails on any drift from their baselines
        # beyond the tolerance for anti-aliasing and glass (docs/ci.md "UI
        # snapshot baselines"). The matrix size goes with the shard, so a
        # matrix that no longer matches SnapshotShard.count fails every shard.
        timeout-minutes: 20
        run: scripts/snapshots.sh gate "${{ matrix.shard }}/${{ strategy.job-total }}"
      - name: Summarize
        if: always()
        run: |
          for summary in build/snapshots/determinism/summary.md build/snapshots/report/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload the renders
        # What `make approve` fetches to approve a baseline drift.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-shard-${{ matrix.shard }}
          path: build/snapshots/render
          if-no-files-found: ignore
      - name: Upload the drift report
        # Before, after and difference images of each drifted snapshot, with
        # index.html showing them side by side at real size.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshot-report-shard-${{ matrix.shard }}
          path: |
            build/snapshots/report
            build/snapshots/determinism
          if-no-files-found: ignore

  ui-snapshots:
    # The one check the main ruleset requires: passes only when every shard
    # ran and passed.
    name: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'ui-snapshots' || 'ui-snapshots (mark the pull request ready for review to run)' }}
    needs: ui-snapshots-shard
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "The shards: ${{ needs.ui-snapshots-shard.result }}"
          [ "${{ needs.ui-snapshots-shard.result }}" = success ]

  ui-snapshots-drift-comment:
    # Shows a pull request's drift where its reviewer already is: one comment,
    # updated in place on every later run, with each drifted snapshot's
    # approved image, this run's render and their difference inline
    # (docs/ci.md "UI snapshot baselines"). A comment's image must be at a
    # public address, and an artifact needs a login to fetch, so the images are
    # pushed to refs/ui-snapshots-drift/pr-<number>, a ref outside refs/heads
    # that a clone never fetches, replaced on each run and read through
    # raw.githubusercontent.com at its commit. Not a required check; a pull
    # request from a fork, whose token cannot write, gets no comment, and nor
    # does a merge queue group, which has no pull request of its own.
    name: ui-snapshots drift comment
    needs: ui-snapshots-shard
    if: >-
      !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the drift reports
        uses: actions/download-artifact@v8
        with:
          pattern: ui-snapshot-report-shard-*
          path: build/snapshots/shards
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARDS_RESULT: ${{ needs.ui-snapshots-shard.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/snapshot-drift-comment.sh build/snapshots/shards
