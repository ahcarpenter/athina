name: CI

# Runs on every push to a pull request and to main: build-and-test, lint,
# the API tier of the end-to-end harness with its checkpoints, e2e-api, and
# the fast UI check, ui-snapshots-smoke. The slow, full-fidelity ui-snapshots
# check lives in merge-checks.yml, which runs on push to main and for a pull
# request only with the merge-checks label; the main ruleset requires all five
# at a pull request's head before it merges (README "Continuous integration").
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that pull request's run still going, so
# a superseded commit stops holding macOS runners, of which the account runs
# five at once. Every push to main keeps its own run (the run id is its group).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # The package targets macOS 26, so it needs the Xcode 26 SDK that the
    # macos-26 image ships. Older images cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/swiftpm-cache
        with:
          name: build-and-test
      - name: Unit tests
        # The suite runs on a test clock and takes seconds once built; a wait
        # that never ends fails the job here rather than at the six-hour limit.
        timeout-minutes: 20
        run: swift test
      - name: A build without the ControlAPI trait carries no control API
        # scripts/release.sh refuses a release binary that carries it (README
        # "The control API"). The debug Athina the unit tests' build already
        # made is such a build, so this checks it rather than compiling the
        # package again; `swift build` only confirms it is current. The
        # development bundle, which must carry it, is e2e-api's to build and
        # check, so this job compiles the package once.
        run: |
          swift build --product Athina
          scripts/check-no-control-api.sh "$(swift build --show-bin-path)/Athina"

  lint:
    # Google's Swift style (README "Code style"): swift-format from the Xcode
    # that .xcode-version pins checks every Swift file against the committed
    # .swift-format and fails on any finding.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - name: Lint
        timeout-minutes: 10
        run: make lint

  e2e-api:
    # Every API-tier scenario of the end-to-end harness, run hermetically
    # through the app's control API, twice, then their checkpoints compared
    # with the approved baselines in Tests/Checkpoints as ui-snapshots
    # compares a snapshot (README "Checkpoints"). The app is launched through
    # LaunchServices (--launch open): exec'd from this job's shell, which the
    # runner image grants Accessibility, it would inherit the grant, and the
    # run could never catch a change that made the API tier need one.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - name: Hide the Dock
        # The runner's display is 1024 by 768, and with the Dock showing, the
        # tallest Settings panes are taller than the room left, so macOS cuts
        # the window off above their end and their last rows cannot be
        # scrolled into view. System Events hides it at once. Should it ever
        # refuse, the Dock is restarted hidden instead, which can take two
        # minutes, so this goes first and is waited for after the build.
        timeout-minutes: 2
        run: |
          if ! osascript -e 'tell application "System Events" to set autohide of dock preferences to true'; then
            defaults write com.apple.dock autohide -bool true
            killall Dock
          fi
      - name: Install bash 4 or newer
        # The harness needs it, and macOS ships 3.2 as /bin/bash.
        run: brew install bash
      - name: Let the hermetic copy record its own windows
        # Screen Recording for the API tier's copy of the app, which the
        # harness makes under this identifier, so a checkpoint is captured
        # with ScreenCaptureKit, glass, title bar and toolbar included, as
        # ui-snapshots captures a snapshot. Only Screen Recording: an
        # Accessibility grant is what the launch through open keeps away.
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, flags) values ('kTCCServiceScreenCapture', 'com.ahcarpenter.athina.e2e', 0, 2, 4, 1, 0)"
      - uses: ./.github/actions/swiftpm-cache
        with:
          name: e2e-api
      - name: Build the app bundle
        # The development bundle, built with the ControlAPI trait, so it must
        # carry the control API; build-and-test checks that a build without the
        # trait carries none (README "The control API").
        run: |
          scripts/bundle.sh release
          if scripts/check-no-control-api.sh build/Athina.app/Contents/MacOS/Athina; then
            echo "the development bundle should carry the control API" >&2
            exit 1
          fi
      - name: Wait for the Dock to hide
        # Fails rather than run the scenarios with the Dock showing.
        run: |
          for _ in $(seq 1 60); do
            room="$(swift -e 'import AppKit; print(Int(NSScreen.main?.visibleFrame.height ?? 0))' 2>/dev/null || echo 0)"
            echo "the display has ${room} points of height to lay windows out in"
            [ "$room" -ge 728 ] && exit 0
            sleep 2
          done
          echo "::error::The Dock never hid, so the tallest Settings panes would be cut off." >&2
          exit 1
      - name: Run the API tier twice and compare its checkpoints with their baselines
        timeout-minutes: 20
        run: scripts/snapshots.sh checkpoints --launch open
      - name: Summarize
        if: always()
        run: |
          for summary in build/checkpoints/determinism/summary.md build/checkpoints/report/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload the checkpoints
        # What `make checkpoints-approve` fetches to approve a drift.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoints
          path: build/checkpoints/render
          if-no-files-found: ignore
      - name: Upload the drift report and the runs' evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoints-report
          path: |
            build/checkpoints/report
            build/checkpoints/determinism
            build/checkpoints/runs
          if-no-files-found: ignore

  ui-snapshots-smoke:
    # The fast UI check, and the check the main ruleset requires: draws every
    # snapshot in the test process with swift-snapshot-testing and compares
    # each with its reference image, recorded on this image with the pinned
    # Xcode as the ui-snapshots baselines were (README "UI snapshot smoke
    # test"). One runner: most of the job is fetching and compiling, which the
    # build cache cuts to what changed, and drawing all 76 images takes about a
    # minute, where four runners each compiled it again.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/swiftpm-cache
        with:
          name: ui-snapshots-smoke
      - name: Draw every snapshot and compare with its reference
        timeout-minutes: 20
        run: make ui-snapshots-smoke
      - name: Summarize
        if: always()
        run: |
          if [ -f build/snapshots-smoke/summary.md ]; then
            cat build/snapshots-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the approvable set
        # What `make snapshots-smoke-approve` fetches to approve a drift.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-smoke-set
          path: build/snapshots-smoke/references
          if-no-files-found: ignore
      - name: Upload the drift report
        # The reference, the new render and their difference, one folder per
        # drifted snapshot.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-smoke-report
          path: build/snapshots-smoke/drift
          if-no-files-found: ignore
