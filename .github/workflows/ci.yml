name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The package targets macOS 26, so it needs the Xcode 26 SDK that the
    # macos-26 image ships. Older images cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version
      - name: Unit tests
        # The suite runs on a test clock and takes seconds once built; a wait
        # that never ends fails the job here rather than at the six-hour limit.
        timeout-minutes: 20
        run: swift test
      - name: The committed mark assets match the master vector
        # The app icon and the menu bar mark are generated from
        # Resources/Mark/MentorMark.svg and committed, so a plain build needs
        # nothing else. Rebuilding them is reproducible down to the byte, so
        # anything left over here means the committed assets drifted from the
        # drawing they claim to come from.
        run: |
          make mark
          git diff --exit-code -- Resources/AppIcon.icns Resources/Mark
      - name: Build app bundle
        run: scripts/bundle.sh release
      - name: Render UI snapshots
        run: build/Mentor.app/Contents/MacOS/Mentor --snapshot snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots
          if-no-files-found: error
