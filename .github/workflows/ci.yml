name: CI

# Runs on every pull request and every push to main. The slower checks,
# ui-snapshots and xcode-project, live in merge-checks.yml, which runs on push
# to main and for a pull request only on demand; all three must pass at a pull
# request's head before it merges (README "Continuous integration").
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The package targets macOS 26, so it needs the Xcode 26 SDK that the
    # macos-26 image ships. Older images cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version
      - name: Unit tests
        # The suite runs on a test clock and takes seconds once built; a wait
        # that never ends fails the job here rather than at the six-hour limit.
        timeout-minutes: 20
        run: swift test
      - name: Build app bundle
        run: scripts/bundle.sh release
