name: CI

# Runs on every push to a pull request and to main: build-and-test and the
# fast UI check, ui-snapshots-smoke. The slow, full-fidelity ui-snapshots
# check lives in merge-checks.yml, which runs on push to main and for a pull
# request only with the merge-checks label; the main ruleset requires all three
# at a pull request's head before it merges (README "Continuous integration").
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The package targets macOS 26, so it needs the Xcode 26 SDK that the
    # macos-26 image ships. Older images cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version
      - name: Unit tests
        # The suite runs on a test clock and takes seconds once built; a wait
        # that never ends fails the job here rather than at the six-hour limit.
        timeout-minutes: 20
        run: swift test
      - name: Build app bundle
        run: scripts/bundle.sh release
      - name: Only the development bundle carries the control API
        # The bundle above is a development one, built with the ControlAPI
        # trait; a release is built without it, and scripts/release.sh refuses
        # a binary that carries it (README "The control API").
        run: |
          if scripts/check-no-control-api.sh build/Athina.app/Contents/MacOS/Athina; then
            echo "the development bundle should carry the control API" >&2
            exit 1
          fi
          swift build -c release --product Athina
          scripts/check-no-control-api.sh "$(swift build -c release --product Athina --show-bin-path)/Athina"

  ui-snapshots-smoke-shard:
    # The fast UI check, split across four runners like ui-snapshots and by
    # the same SnapshotShard table: each draws its quarter of the snapshots in
    # the test process with swift-snapshot-testing and compares each with its
    # reference image. The references were recorded on this image with its
    # newest Xcode, as the ui-snapshots baselines were (README "UI snapshot
    # smoke test").
    name: ui-snapshots-smoke shard ${{ matrix.shard }}
    strategy:
      # Every shard runs to the end, so one drift never hides another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          sw_vers
          swift --version
      - name: Draw this shard's snapshots and compare with their references
        # The matrix size goes with the shard, so a matrix that no longer
        # matches SnapshotShard.count fails every shard.
        timeout-minutes: 20
        run: make ui-snapshots-smoke SHARD="${{ matrix.shard }}/${{ strategy.job-total }}"
      - name: Summarize
        if: always()
        run: |
          if [ -f build/snapshots-smoke/summary.md ]; then
            cat build/snapshots-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the approvable set
        # What `make snapshots-smoke-approve` fetches, every shard's together,
        # to approve a drift.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-smoke-shard-${{ matrix.shard }}
          path: build/snapshots-smoke/references
          if-no-files-found: ignore
      - name: Upload the drift report
        # The reference, the new render and their difference, one folder per
        # drifted snapshot.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-smoke-report-shard-${{ matrix.shard }}
          path: build/snapshots-smoke/drift
          if-no-files-found: ignore

  ui-snapshots-smoke:
    # The one check the main ruleset requires: passes only when every shard
    # ran and passed. A job that an `if` skips still reports a check run, and
    # a skipped check counts as passed for a required one; GitHub names a
    # skipped job after its unevaluated name expression, so only a run of this
    # job ever reports ui-snapshots-smoke.
    name: ${{ 'ui-snapshots-smoke' }}
    needs: ui-snapshots-smoke-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "The shards: ${{ needs.ui-snapshots-smoke-shard.result }}"
          [ "${{ needs.ui-snapshots-smoke-shard.result }}" = success ]
